# Mochi — nginx site config
# Place at: /etc/nginx/sites-available/mochi
# Enable: sudo ln -sf /etc/nginx/sites-available/mochi /etc/nginx/sites-enabled/mochi

server {
    listen 80;
    server_name twilightdreamworks.com www.twilightdreamworks.com 18.206.62.200;

    # React SPA
    root /var/www/mochi;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed assets — long cache, no revalidation
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy /api/* → FastAPI on 8001
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
