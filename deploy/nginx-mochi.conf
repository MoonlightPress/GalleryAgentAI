# Mochi - nginx site config.
#
# THIS FILE IS A MIRROR OF WHAT IS ACTUALLY RUNNING. Keep it that way.
# Pulled from the server 2026-09-08 with:
#   ssh ubuntu@18.206.62.200 "cat /etc/nginx/sites-enabled/mochi"
#
# -- Two traps, both found the hard way on 2026-09-08 -------------------------
#
# 1. THE LIVE FILE IS sites-ENABLED/mochi, AND IT IS A REGULAR FILE, NOT A
#    SYMLINK. `sites-available/mochi` is a decoy: it has been diverging since
#    26 July and nginx never reads it. Editing sites-available does nothing.
#    Always edit /etc/nginx/sites-enabled/mochi.
#
# 2. DO NOT `scp` THIS FILE OVER THE SERVER'S. An earlier version of this file
#    had drifted so far that copying it would have DELETED the /Arcadia/ proxy
#    and the `include snippets/life.conf` line - neither of which was ever in
#    the repo copy. Make surgical edits on the server, then re-pull to here.
#
# Apply a change like this:
#   ssh ... "sudo cp /etc/nginx/sites-enabled/mochi /etc/nginx/mochi-enabled.bak.$(date -u +%Y%m%dT%H%M%SZ)"
#   # ...edit /etc/nginx/sites-enabled/mochi in place (python3/sed), then:
#   ssh ... "sudo nginx -t && sudo systemctl reload nginx"
#   # ...and re-pull the result into this file so the mirror stays true.
#
# -- Known drift, deliberately NOT carried here -------------------------------
#
# Two changes were written into the old repo copy and never reached the server,
# because of trap 1. Neither is live, so neither is in this mirror:
#   * a `gzip on` block. Compression IS active on the site - it comes from the
#     http block in /etc/nginx/nginx.conf, not from here.
#   * a single-Cache-Control cleanup for /mochi/assets/. The server still runs
#     `expires 1y` + `add_header`, which emits two Cache-Control headers.
# If either is still wanted, apply it on the server by the recipe above.
#
# Also on the box: /etc/nginx/sites-enabled/mochi.bak.1785065957 is a second
# ENABLED file with the same server_name. nginx ignores it (hence the
# "conflicting server name" warnings on every reload) but it should be removed.
#
# SSL lines are managed by Certbot - do not edit them.
server {
    server_name twilightdreamworks.com www.twilightdreamworks.com 18.206.62.200;
include snippets/life.conf;

    root /var/www;

    # Arcadia: the Node spine on 4700 (BASE_PATH=/Arcadia). The trailing slash on
    # proxy_pass strips the prefix, so the app sees /hub, /store, /primer.
    location = /Arcadia { return 301 /Arcadia/; }
    location /Arcadia/ {
        proxy_pass         http://127.0.0.1:4700/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
    index index.html;
    add_header Cache-Control "no-cache" always;

    # Root: landing page (+ room for future experiments)
    location / {
        try_files $uri $uri/ =404;
    }

    # Mochi app under /mochi/
    location = /mochi { return 301 /mochi/; }
    location /mochi/ {
        try_files $uri $uri/ /mochi/index.html;
    }

    # /mochi2 — the Saffron restructure prototype. Same build, same SPA; the page
    # lives at the #observe2 hash, which is deliberately not in the nav. A fragment
    # survives a 302, so nothing extra is built or served. Delete to retire it.
    location = /mochi2  { return 302 /mochi/#observe2; }
    location = /mochi2/ { return 302 /mochi/#observe2; }
    location /mochi/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy /api/* -> FastAPI on 8001 (the app fetches /api from root)
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/twilightdreamworks.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/twilightdreamworks.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.twilightdreamworks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = twilightdreamworks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name twilightdreamworks.com www.twilightdreamworks.com 18.206.62.200;
    return 404; # managed by Certbot
}
