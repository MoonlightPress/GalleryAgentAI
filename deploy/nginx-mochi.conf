# Mochi — nginx site config.
# App moved to /mochi/ ; root (/) serves the twilight landing page + future experiments.
# SSL lines are managed by Certbot — do not edit them.
server {
    server_name twilightdreamworks.com www.twilightdreamworks.com 18.206.62.200;

    root /var/www;
    index index.html;
    add_header Cache-Control "no-cache" always;

    # Root: landing page (+ room for future experiments)
    location / {
        try_files $uri $uri/ =404;
    }

    # Mochi app under /mochi/
    location = /mochi { return 301 /mochi/; }
    location /mochi/ {
        try_files $uri $uri/ /mochi/index.html;
    }
    location /mochi/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy /api/* -> FastAPI on 8001 (the app fetches /api from root)
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/twilightdreamworks.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/twilightdreamworks.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.twilightdreamworks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = twilightdreamworks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name twilightdreamworks.com www.twilightdreamworks.com 18.206.62.200;
    return 404; # managed by Certbot
}
