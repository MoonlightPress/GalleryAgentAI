# Mochi — nginx site config.
# App moved to /mochi/ ; root (/) serves the twilight landing page + future experiments.
# SSL lines are managed by Certbot — do not edit them.
#
# MANUAL RE-APPLY REQUIRED: this file is NOT installed by deploy.sh (deploy.sh only
# reloads nginx). After committing a change here you MUST copy it onto the server and
# reload, e.g.:
#   scp deploy/nginx-mochi.conf ubuntu@18.206.62.200:/tmp/nginx-mochi.conf
#   ssh ubuntu@18.206.62.200 "sudo cp /tmp/nginx-mochi.conf /etc/nginx/sites-available/<site> \
#     && sudo nginx -t && sudo systemctl reload nginx"
#
# Verified live 2026-09-07: gzip IS active (index.js comes back
# `Content-Encoding: gzip`, 424 KB -> 137 KB) and /mochi/assets/ IS cached for a
# year, so the server is running this file. The only change since is the
# single-Cache-Control cleanup below, which still needs the scp+reload above.
server {
    server_name twilightdreamworks.com www.twilightdreamworks.com 18.206.62.200;

    root /var/www;
    index index.html;
    add_header Cache-Control "no-cache" always;

    # HTTP compression — the ~403 KB JS bundle was being served uncompressed.
    # Covers the text-y asset types; gzip skips already-compressed binaries (png/webp).
    # (brotli omitted: it requires the ngx_brotli module, which is not built into the
    #  stock nginx on this Lightsail box — adding brotli_* directives without the module
    #  would make `nginx -t` fail. gzip is built-in and is the safe, portable win here.)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain;
    gzip_vary on;

    # Root: landing page (+ room for future experiments)
    location / {
        try_files $uri $uri/ =404;
    }

    # Mochi app under /mochi/
    location = /mochi { return 301 /mochi/; }
    location /mochi/ {
        try_files $uri $uri/ /mochi/index.html;
    }
    # /mochi2 — the Saffron restructure prototype. It is the same build and the
    # same SPA; the page lives at the #observe2 hash, which is deliberately not
    # in the nav. A fragment survives a 302, so this hands the browser the hash
    # and nothing new has to be built or served. Delete both lines to retire it.
    location = /mochi2  { return 302 /mochi/#observe2; }
    location = /mochi2/ { return 302 /mochi/#observe2; }

    # Vite writes a content hash into every filename here, so these files can
    # never change under a given URL and are safe to cache forever.
    #
    # One header, not two. `expires 1y` emits its own `Cache-Control: max-age=`
    # line, so pairing it with an add_header sent the response with TWO
    # Cache-Control headers ("max-age=31536000" and "public, immutable").
    # Browsers merge them, but intermediaries are allowed not to, and a split
    # directive set is the kind of thing that silently stops working.
    #
    # NOTE: this add_header is also what stops the server-level `no-cache` above
    # from applying to assets — an add_header in a location block replaces the
    # inherited set rather than adding to it. If this directive is ever removed,
    # every hashed asset inherits `no-cache` and the site re-downloads its whole
    # bundle and hero art on every page load. Do not delete it.
    location /mochi/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Proxy /api/* -> FastAPI on 8001 (the app fetches /api from root)
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/twilightdreamworks.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/twilightdreamworks.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.twilightdreamworks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = twilightdreamworks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name twilightdreamworks.com www.twilightdreamworks.com 18.206.62.200;
    return 404; # managed by Certbot
}
