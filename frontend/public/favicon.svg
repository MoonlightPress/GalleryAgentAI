<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Mochi's Atelier — a watercolor paintbrush, dipped in colour -->
  <g transform="rotate(-32 24 24)">
    <!-- handle (warm wood) -->
    <rect x="19" y="2" width="9" height="21" rx="4.5" fill="#c47a35"/>
    <!-- ferrule (metal band) -->
    <rect x="16.5" y="20" width="14" height="7" rx="1.6" fill="#b9ad96"/>
    <rect x="16.5" y="22.4" width="14" height="1.4" fill="#9c8f78"/>
    <!-- bristles, tapering to a soft tip -->
    <path d="M17.5 27 H29.5 L26.4 41.5 Q24 47.5 21.6 41.5 Z" fill="#3a3020"/>
    <!-- a watercolor dab at the very tip -->
    <circle cx="24" cy="44" r="4.2" fill="#d98b7a"/>
    <circle cx="24" cy="44" r="4.2" fill="#c25b48" opacity="0.45"/>
  </g>
</svg>
